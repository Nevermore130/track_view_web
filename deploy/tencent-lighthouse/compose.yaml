name: trace-atlas

x-web-common: &web-common
  image: caddy:2.11.4-alpine
  restart: unless-stopped
  environment:
    SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
  volumes:
    - /srv/trace-atlas:/srv/trace-atlas:ro
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--quiet",
        "--tries=1",
        "--spider",
        "http://127.0.0.1:2019/config/",
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  web:
    <<: *web-common
    profiles:
      - direct
    container_name: trace-atlas-web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:8080:8081"

  web-cpolar:
    <<: *web-common
    profiles:
      - cpolar
    container_name: trace-atlas-web-cpolar
    ports:
      - "127.0.0.1:8080:80"

volumes:
  caddy_data:
  caddy_config:
